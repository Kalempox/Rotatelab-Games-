<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Popcade</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      /*
        Oyun TELEFON oranında bir kutuda yaşar, pencereyi doldurmaz.

        Sebebi estetik değil doğruluk: hedef cihaz portre bir telefon ve kadraj
        içerikten türetiliyor. Masaüstünde pencereyi doldurmak, hiçbir oyuncunun
        görmeyeceği bir en-boy oranını akort etmek demekti — makine geniş ekranda
        "doğru" görünüp telefonda kırpılabilirdi.

        `position: relative` şart: HUD ve overlay bu kutuya göre konumlanır,
        pencereye göre değil.
      */
      body {
        display: grid;
        place-items: center;
        background: #0b0d12;
      }
      #hc-root {
        position: relative;
        aspect-ratio: 9 / 19.5;
        height: min(100dvh, calc(100vw * 19.5 / 9));
        max-height: 100dvh;
        max-width: 100vw;
        overflow: hidden;
        display: block;
        border-radius: min(2.6vh, 22px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 18px 60px rgba(0, 0, 0, 0.55);
      }
      #hc-root > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DIVEWWoO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D63AJU87.css">
  </head>
  <body>
    <div id="hc-root"></div>
  </body>
</html>
